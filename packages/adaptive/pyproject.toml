[project]
name = "appscreenmap-adaptive"
version = "0.1.0"
description = "AppScreenMap adaptive UI audit: the rule catalogue (Android adaptive app quality, Android 17, Apple HIG / iPhone Duo) and the static checks of a build's manifest or Info.plist → audits/adaptive.json."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-drivers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
