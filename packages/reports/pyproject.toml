[project]
name = "appscreenmap-reports"
version = "0.1.0"
description = "AppScreenMap run reports: crawl health (wasted steps, identity issues) and navigation performance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-core", "appscreenmap-drivers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
