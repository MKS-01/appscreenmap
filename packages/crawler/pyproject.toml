[project]
name = "appscreenmap-crawler"
version = "0.1.0"
description = "AppScreenMap crawler: explores an app screen by screen (explorer), replays recorded paths, measures load times."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-core", "appscreenmap-drivers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
