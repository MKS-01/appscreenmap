[project]
name = "appscreenmap-testkit"
version = "0.1.0"
description = "Dev-only test helpers for the AppScreenMap packages: synthetic hierarchies, a fake device and the repo root."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-core", "appscreenmap-drivers", "appscreenmap-crawler", "pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
