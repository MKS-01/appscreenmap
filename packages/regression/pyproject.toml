[project]
name = "appscreenmap-regression"
version = "0.1.0"
description = "AppScreenMap regression checks: replay a run against its baselines (verify) and diff two runs visually."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-core", "appscreenmap-drivers", "appscreenmap-crawler"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
