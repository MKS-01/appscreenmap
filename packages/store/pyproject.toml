[project]
name = "appscreenmap-store"
version = "0.1.0"
description = "AppScreenMap store readiness: target / compile / minimum SDK of an Android or iOS build against Google Play and App Store rules → audits/store.json."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-drivers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
