[project]
name = "appscreenmap-a11y"
version = "0.1.0"
description = "AppScreenMap accessibility audit: WCAG 2.2 checks across a run and the HTML/Markdown report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-core", "appscreenmap-drivers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
