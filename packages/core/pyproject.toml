[project]
name = "appscreenmap-core"
version = "0.1.0"
description = "AppScreenMap core: the map.json model, hierarchy analysis, crawl config, run folders, notes and media."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
