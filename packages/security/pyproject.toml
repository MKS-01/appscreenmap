[project]
name = "appscreenmap-security"
version = "0.1.0"
description = "AppScreenMap security audit: manifest, hard-coded secrets, data at rest and Frida evidence → audits/security.json."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["appscreenmap-drivers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
