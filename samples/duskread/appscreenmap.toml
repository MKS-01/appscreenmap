# Crawl config for DuskRead (https://github.com/MKS-01/duskread), a real reading app.
# appscreenmap crawl --apk samples/duskread/duskread-1.3.0.apk --config samples/duskread/appscreenmap.toml --clear-data

[crawl]
max_steps = 200
stop_after_no_new = 30
perf_budget_ms = 1000

[inputs]
# Onboarding asks for a name; the Notion setup asks for a token (a dummy value is fine).
"name" = "Demo Reader"
"token|secret|notion" = "not-a-real-token"
default = "test"
