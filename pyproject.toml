# Workspace root (virtual: not a package itself). The product is apps/engine plus packages/*.

[tool.uv.workspace]
members = ["apps/engine", "packages/*"]
exclude = ["packages/design-tokens"]  # CSS only, no Python

[tool.uv.sources]
appscreenmap-engine = { workspace = true }
appscreenmap-core = { workspace = true }
appscreenmap-drivers = { workspace = true }
appscreenmap-security = { workspace = true }
appscreenmap-store = { workspace = true }
appscreenmap-crawler = { workspace = true }
appscreenmap-a11y = { workspace = true }
appscreenmap-reports = { workspace = true }
appscreenmap-regression = { workspace = true }
appscreenmap-exporters = { workspace = true }
appscreenmap-testkit = { workspace = true }

[dependency-groups]
dev = ["appscreenmap-engine[mcp]", "appscreenmap-testkit", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["apps/*/src", "packages/*/src"]  # first-party code, for import sorting
extend-exclude = [".claude/skills/play-policy-insights"]  # vendored from github.com/android/skills, kept unchanged

[tool.pytest.ini_options]
testpaths = ["apps/*/tests", "packages/*/tests"]
markers = ["slow: runs the fake app through the crawler (seconds each); skipped by `make test-fast`"]
addopts = "--import-mode=importlib"  # test files in different packages share names
