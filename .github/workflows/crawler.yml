name: crawler

on:
  push:
    paths: ["apps/engine/**", "packages/**", "pyproject.toml", "uv.lock", ".github/workflows/crawler.yml"]
  pull_request:
    paths: ["apps/engine/**", "packages/**", "pyproject.toml", "uv.lock", ".github/workflows/crawler.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
