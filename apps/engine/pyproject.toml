[project]
name = "appscreenmap-engine"
version = "0.1.0"
description = "Automatically explore a mobile app screen by screen and build a navigable map of every screen and transition."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "AppScreenMap contributors" }]
keywords = ["android", "ios", "testing", "crawler", "ui-automation", "maestro", "visual-testing", "accessibility", "wcag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["appscreenmap-core", "appscreenmap-drivers", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/MKS-01/appscreenmap"
Repository = "https://github.com/MKS-01/appscreenmap"
Issues = "https://github.com/MKS-01/appscreenmap/issues"
Changelog = "https://github.com/MKS-01/appscreenmap/releases"

[project.scripts]
appscreenmap-engine = "appscreenmap.cli:main"
appscreenmap = "appscreenmap.cli:main"  # until the Bun CLI (apps/cli) takes this name

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]  # `appscreenmap mcp`: the map as an MCP server for agents

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appscreenmap"]
